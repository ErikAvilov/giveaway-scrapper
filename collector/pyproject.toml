[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giveaway-collector"
version = "0.1.0"
description = "Lightweight giveaway discovery collector for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "scrapling[fetchers]>=0.4.15",
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
collector = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
